version: "v0.4"

project:
  name: "A proof of Conway's refinement conjecture"
  description: >-
    A Lean proof of Conway's 1976 refinement conjecture for omnific integers. For omnific integers
    a, b, c, d with ab = cd, it proves the existence of omnific integers e, f, g, h satisfying
    a = ef, b = gh, c = eg, and d = fh, including zero and degenerate cases. The proof proceeds
    through factorisation and refinement theory for generalised-power-series
    integer parts and connects the generalised-power-series and surreal-number formulations.
  authors:
    - "Dan Abramov"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Dan Abramov"

