fidelity:
  divergences: >-
    No algebraic divergence from Conway's displayed four-factor formula is known. The Challenge
    represents surreal numbers by numeric well-founded games and writes equality as Conway
    equivalence, rather than constructing one class-sized quotient. Omnific-integer membership is
    the cut equation x = {x - 1 | x + 1}; the full formalization also proves its equivalence with
    the generalised-power-series normal-form formulation. Lean's universes impose set-sized option
    families at each instantiation. No nonzero or nondegeneracy assumption is added.

review:
  status: "agent-reviewed and self-assessed"
  notes: >-
    Lean checks the proof and repository audits enforce the admitted-axiom policy. AI-assisted
    review compared the proof guide's statements and proof prose with the Lean source. The
    standalone statement and its correspondence with Conway's displayed formula were separately
    re-audited before submission. No independent specialist or peer review is recorded.
    PALOMAR-PROVENANCE.md gives the source comparison and literature search.

alignment:
  namespace: "ConwayRefinement.Palomar"
  statements:
    - source: >-
        Conway, On Numbers and Games (1976), p. 46; L'Innocente–Mantova (2024),
        Conjecture 1.1.1(2)
      lean: "ConwayRefinement.Palomar.conwayRefinement"
      module: "Challenge"
      status: "proved"
      note: >-
        The Lean theorem is the same 2-by-2 multiplicative refinement formula. Its quantified
        objects are numeric-game representatives satisfying the omnific-integer cut equation,
        and every displayed equality is Conway equivalence.

acknowledgements: >-
  John Conway posed the conjecture. The proof draws on work of Zafrullah, Berarducci,
  Pitteloud, Pommersheim–Shahriari, L'Innocente, Mantova, Fornasiero and Lavi, and on Mathlib
  and CombinatorialGames. ChatGPT and Claude assisted extensively.
