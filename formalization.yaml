status:
  scope: >-
    The compared Challenge defines well-founded Conway games with option families in an arbitrary
    universe, Conway negation, addition, multiplication and order, surreal representatives as
    numeric games, and omnific integers by the cut equation x = {x - 1 | x + 1}. Its theorem
    proves the four-factor refinement statement for every a, b, c, d satisfying that equation,
    including zero and degenerate cases. Equality is Conway equivalence of numeric games, hence
    equality in their quotient. The statement is universe-polymorphic and uses set-sized option
    families at each instantiation; it does not construct one type containing the proper class
    of all surreal numbers.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - "Conway's four-factor refinement theorem for omnific integers"

